version: '3.0'

services:
  db:
    image: postgis/postgis:15-3.5-alpine
    hostname: db
    container_name: sinx_db
    volumes:
      - .data/db:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    command: ["-c", "log_timezone=Asia/Krasnoyarsk"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s  # Дать время на инициализацию

  backend:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    container_name: sinx_backend
    volumes:
      - .:/opt
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GDAL_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgdal.so
      - GEOS_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgeos_c.so
    entrypoint: bash ./docker/entrypoint.sh server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 5s
      timeout: 3s
      retries: 5
      
  redis:
    image: redis:8.0-alpine
    container_name: sinx_redis
    volumes:
      - redis_data:/data
    env_file:
      - .env
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    command: celery -A config worker -l INFO
    container_name: sinx_celery
    volumes:
      - .:/opt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

volumes:
  redis_data: